name: cryptavault

services:
  minio:
    image: minio/minio:latest
    container_name: cryptavault-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cryptavault_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    container_name: cryptavault-postgres
    profiles: ["localdb"]
    environment:
      POSTGRES_DB: cryptavault
      POSTGRES_USER: cryptavault
      POSTGRES_PASSWORD: cryptavault
    ports:
      - "5433:5432"
    volumes:
      - cryptavault_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptavault -d cryptavault"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cryptavault_minio:
  cryptavault_postgres:
