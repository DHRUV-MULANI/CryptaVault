[project]
name = "cryptavault-api"
version = "0.1.0"
description = "FastAPI backend orchestrator and zero-knowledge storage coordinator for CryptaVault"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CryptaVault Contributors" }]
dependencies = [
    "cryptavault-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "supabase>=2.6.0",
    "gotrue>=2.6.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0.0",
]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
cryptavault-core = { workspace = true }

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cryptavault_api*"]
