[project]
name = "cryptavault-core"
version = "0.1.0"
description = "Core cryptographic engine and security profiles for CryptaVault"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CryptaVault Contributors" }]
dependencies = [
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
    "blake3>=0.4.1",
    "zstandard>=0.23.0",
    "brotli>=1.1.0",
    "paramiko>=3.5.0",
    "qrcode[pil]>=7.4.2",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "mnemonic>=0.21",
]

[project.optional-dependencies]
pq = [
    "liboqs-python>=0.10.0",
]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "types-paramiko",
]

[project.entry-points."cryptavault.plugins"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cryptavault*"]
