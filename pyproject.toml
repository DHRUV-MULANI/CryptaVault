[project]
name = "cryptavault-workspace"
version = "0.1.0"
description = "AI-Assisted Adaptive Hybrid Cryptographic Storage Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.workspace]
members = ["packages/core", "packages/api", "packages/cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --hypothesis-seed=0"
testpaths = ["packages/core/tests", "packages/api/tests", "packages/cli/tests"]
pythonpath = ["packages/core", "packages/api", "packages/cli"]
